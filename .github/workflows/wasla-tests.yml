name: wasla-tests

on:
  push:
    paths:
      - "wasla/**"
      - ".github/workflows/wasla-tests.yml"
  pull_request:
    paths:
      - "wasla/**"
      - ".github/workflows/wasla-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (double-spend, caps, expiry, settlement)
        run: python3 -m pytest tests/ -v
      - name: Run settlement simulator (deterministic)
        run: python3 -m settlement.simulator --seed 7 --users 8

  web-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run web demo engine test (Ed25519 in Node Web Crypto)
        run: node wasla/web/engine.test.js

  settlement-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL settlement tests
        env:
          PGPASSWORD: postgres
        working-directory: wasla/supabase
        run: |
          export DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres"
          bash tests/run.sh

  wasla-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasla/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  wasla-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasla/packages/wasla_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Coverage gate (>= 90%, mandatory per plan)
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          pct=$(awk -F: '/^LF/{lf+=$2} /^LH/{lh+=$2} END{printf "%d", 100*lh/lf}' coverage/lcov.info)
          echo "line coverage: ${pct}%"
          test "$pct" -ge 90
